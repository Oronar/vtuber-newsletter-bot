name: Publish weekly issue

# The SIGNAL//BOOST cloud routine can't push to `main` — Claude Code routines
# may only push to `claude/*` branches. So the routine writes the new issue on a
# `claude/issue-NNN` branch and pushes that; this workflow opens a PR from it and
# squash-merges it into `main`, which redeploys Pages and lets discord-notify.yml
# post the permalink.
#
# It authenticates with a PAT (AUTOMERGE_TOKEN secret) rather than the default
# GITHUB_TOKEN on purpose: pushes made with GITHUB_TOKEN do NOT trigger other
# workflows, so a GITHUB_TOKEN merge would silently skip discord-notify.yml. A
# PAT is a real user, so its merge fires the downstream Discord notification.
# The PAT needs, on this repo: Contents = read/write, Pull requests = read/write.

on:
  push:
    branches:
      - "claude/**"
    paths:
      - "docs/_data/issues/**"

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    # Skip the push event generated by --delete-branch below (a deletion has no
    # changed files, but guard anyway so a re-fire can never loop).
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    steps:
      - name: Open and squash-merge the issue PR into main
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          gh pr create --base main --head "$BRANCH" \
            --title "SIGNAL//BOOST weekly issue ($BRANCH)" \
            --body "Automated weekly edition from the SIGNAL//BOOST routine." \
            || echo "PR already exists for $BRANCH; continuing to merge."
          gh pr merge "$BRANCH" --squash --delete-branch
